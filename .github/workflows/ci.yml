name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (testes + isolamento entre tenants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maluporai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
      # app_user é criado pela própria migração de RLS (0002) com essa senha
      # placeholder quando a role ainda não existe — banco efêmero do CI,
      # então não há segredo real em jogo aqui.
      DATABASE_URL: postgresql://app_user:changeme_dev_only_rotate_in_prod@localhost:5432/maluporai_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maluporai_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar segredos de teste (JWT/criptografia)
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Placeholder de .env.test (Node --env-file exige que o arquivo exista)
        run: touch .env.test

      - name: Typecheck
        run: npm run build

      - name: Migrações + suíte de testes (inclui isolamento entre tenants)
        run: npm test

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
